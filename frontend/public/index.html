<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InCensor — 인플루언서 콘텐츠 1차 검수 솔루션</title>
    <meta name="description" content="인플루언서 영상의 음성과 화면 자막을 AI가 읽어 브랜드·제품명, 필수 USP, 금칙어를 1차로 검수합니다.">
    <style>
        /* 사내 보안 통과를 위해 외부 CDN 없이 폰트 파일을 프로젝트 안에 직접 담아 사용한다. */
        @font-face {
          font-family: 'Pretendard Variable';
          font-weight: 45 920;
          font-style: normal;
          font-display: swap;
          src: url('/fonts/PretendardVariable.woff2') format('woff2-variations');
        }
        .rc { --paper:#FFFFFF; --panel:#FFFFFF; --card:#FAFAF9; --ink:#111111;
          --graphite:#4A4A49; --mute:#8A8A86; --line:#E7E6E2; --line2:#EFEEEA;
          --stamp:#111111; --pass:#1F7A3F; --pass-bg:#EAF5EE; --block:#B8342A; --block-bg:#FBECEB;
          --pill:#F0EFEC;
          --sans: "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
          background:var(--paper); color:var(--ink); font-family:var(--sans);
          min-height:100vh; margin:0; -webkit-font-smoothing:antialiased; }
        .rc * { box-sizing:border-box; }
        .rc button { font-family:inherit; cursor:pointer; }

        /* ── 상단 바 + 로고 ─────────────────────────────────── */
        .bar { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:18px; padding:0 24px; height:64px; background:var(--paper); border-bottom:1px solid var(--line); }
        .logo { display:inline-flex; align-items:center; gap:9px; cursor:pointer; user-select:none; border:none; background:transparent; padding:0; }
        .logo .mark { width:21px; height:29px; color:var(--ink); flex:none; }
        .logo .word { font-size:19px; font-weight:800; letter-spacing:-0.03em; color:var(--ink); }
        .bar-sub { font-size:11px; letter-spacing:.02em; color:var(--mute); }
        .spacer { flex:1; }
        .roles { display:flex; gap:3px; background:var(--pill); padding:3px; border-radius:999px; }
        .roles button { background:transparent; border:0; color:var(--graphite); font-size:12px; font-weight:600; padding:7px 15px; border-radius:999px; }
        .roles button.active { background:var(--ink); color:#fff; }

        /* ── 홈 화면 ─────────────────────────────────────────── */
        .home { display:flex; flex-direction:column; min-height:100vh; }
        .home-body { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 20px 100px; }
        .home-body .eyebrow { font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--mute); margin-bottom:14px; }
        .home-body h1 { font-size:28px; font-weight:800; margin:0 0 44px; letter-spacing:-0.01em; }
        .role-row { display:flex; justify-content:center; gap:18px; flex-wrap:wrap; }
        .role-btn { width:260px; min-height:176px; padding:28px 26px; border-radius:22px; background:var(--ink); color:#fff; text-align:left; cursor:pointer; border:none; transition:transform .15s ease, box-shadow .15s ease; box-shadow:0 6px 18px rgba(17,17,17,.14); display:flex; flex-direction:column; justify-content:space-between; }
        .role-btn:hover { transform:translateY(-2px); }
        .role-btn:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
        .role-btn .num { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.16); font-size:11px; font-weight:700; margin-bottom:18px; }
        .role-btn .role-title { font-size:32px; font-weight:800; letter-spacing:-0.02em; text-wrap:balance; }
        .role-btn .arrow { margin-top:18px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; color:rgba(255,255,255,.68); }

        /* ── 레이아웃 기본 ───────────────────────────────────── */
        .wrap { max-width:1180px; margin:0 auto; padding:26px 20px 90px; }
        .eyebrow { font-size:11px; letter-spacing:.06em; color:var(--mute); font-weight:600; text-transform:uppercase; }
        .lede { color:var(--graphite); font-size:13.5px; margin:8px 0 20px; max-width:62ch; }
        .card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px; margin-top:14px; }
        .card-hd { display:flex; align-items:baseline; gap:10px; padding-bottom:13px; border-bottom:1px solid var(--line2); margin-bottom:16px; }
        .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .lab { display:block; font-size:11.5px; font-weight:600; color:var(--graphite); margin-bottom:6px; }
        .in { width:100%; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13.5px; font-family:inherit; }
        .btn { border:none; background:var(--ink); color:#fff; border-radius:999px; padding:10px 20px; font-size:12.5px; font-weight:600; }
        .btn.stamp { background:var(--stamp); }
        .btn.sm { padding:7px 14px; font-size:11.5px; }
        .btn.outline { background:#fff; color:var(--graphite); border:1px solid var(--line); }
        .steps { display:flex; gap:4px; margin:20px 0 16px; background:var(--pill); padding:3px; border-radius:999px; width:fit-content; }
        .steps button { background:transparent; border:0; padding:8px 16px; font-size:12.5px; font-weight:600; color:var(--graphite); border-radius:999px; }
        .steps button.active { color:#fff; background:var(--ink); }
        .tbl { width:100%; border-collapse:collapse; font-size:13px; }
        .tbl th { text-align:left; font-size:11px; font-weight:600; color:var(--mute); padding:0 12px 10px; border-bottom:1px solid var(--line); }
        .tbl td { padding:13px 12px; border-bottom:1px solid var(--line2); }
        .drop { border:1px dashed var(--line); border-radius:14px; background:var(--card); padding:34px 20px; text-align:center; }

        /* ── 상태 배지 ───────────────────────────────────────── */
        .st { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:4px 11px; border-radius:999px; }
        .st.pass { color:var(--pass); background:var(--pass-bg); }
        .st.block { color:var(--block); background:var(--block-bg); }
        .st.none { color:var(--graphite); background:var(--pill); }
        .ocr-pending { display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--graphite); margin-top:3px; }
        .ocr-pending .dot { width:6px; height:6px; border-radius:50%; background:var(--graphite); animation: rc-pulse 1.1s ease-in-out infinite; }
        @keyframes rc-pulse { 0%,100% { opacity:1; } 50% { opacity:.25; } }

        /* ── 업로드 진행률 ───────────────────────────────────── */
        .upload-row { display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px; }
        .upload-row .pct { font-weight:700; font-variant-numeric:tabular-nums; }
        .upload-track { width:100%; min-width:110px; height:7px; border-radius:999px; background:var(--pill); overflow:hidden; }
        .upload-fill { height:100%; border-radius:999px; background:var(--ink); position:relative; overflow:hidden; transition:width .3s ease; }
        .upload-fill::after { content:""; position:absolute; inset:0;
          background-image:linear-gradient(45deg, rgba(255,255,255,.14) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.14) 50%, rgba(255,255,255,.14) 75%, transparent 75%, transparent);
          background-size:14px 14px; animation: rc-stripe .9s linear infinite; }
        @keyframes rc-stripe { from { background-position:0 0; } to { background-position:14px 0; } }

        /* ── 토스트 알림 ─────────────────────────────────────── */
        .toast-wrap { position:fixed; top:20px; right:20px; z-index:300; display:flex; flex-direction:column; gap:10px; width:340px; max-width:calc(100vw - 32px); }
        .toast { display:flex; align-items:flex-start; gap:12px; background:#18181A; color:#fff; border-radius:14px; padding:14px 14px 14px 16px; box-shadow:0 10px 30px rgba(17,17,17,.28); animation: rc-toast-in .18s ease; }
        @keyframes rc-toast-in { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
        .toast .icon { flex:none; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-top:1px; }
        .toast.success .icon { background:#2FBF6E; }
        .toast.error .icon { background:#E5564A; }
        .toast.info .icon { background:rgba(255,255,255,.16); }
        .toast .body { flex:1; min-width:0; }
        .toast .title { font-size:13.5px; font-weight:700; margin-bottom:2px; }
        .toast .desc { font-size:12.5px; color:rgba(255,255,255,.56); line-height:1.5; }
        .toast .close { flex:none; width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,.4); cursor:pointer; font-size:13px; border:none; background:transparent; margin-top:1px; }

        /* ── 랜딩 페이지 (신규 진짜 홈 화면) ───────────────────── */
        .landing a { text-decoration:none; color:inherit; }
        .landing h1, .landing h2, .landing h3, .landing p { margin:0; }
        .landing .lp-wrap { max-width:1120px; margin:0 auto; padding:0 40px; }
        .landing .lp-bar { position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:18px; height:64px; padding:0 40px; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
        .landing .lp-nav { display:flex; gap:22px; font-size:13px; font-weight:600; color:var(--graphite); }
        .landing .lp-nav a:hover { color:var(--ink); }
        .landing .hero { display:grid; grid-template-columns:1fr 1.1fr; gap:52px; align-items:center; padding:72px 0 60px; }
        .landing .tag { display:inline-block; padding:5px 12px; border-radius:999px; background:var(--pill); color:var(--graphite); font-size:11.5px; font-weight:600; margin-bottom:20px; }
        .landing .hero h1 { font-size:46px; line-height:1.24; font-weight:800; letter-spacing:-.03em; text-wrap:balance; }
        .landing .hero p { margin-top:20px; max-width:420px; font-size:15px; line-height:1.85; color:var(--graphite); text-wrap:pretty; }
        .landing .cta-row { display:flex; gap:10px; margin-top:30px; flex-wrap:wrap; }
        .landing .panel { border:1px solid var(--line); border-radius:22px; overflow:hidden; background:#fff; box-shadow:0 18px 44px -30px rgba(17,17,17,.35); }
        .landing .panel-hd { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line2); background:var(--card); font-size:12.5px; font-weight:700; }
        .landing .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line2); border-bottom:1px solid var(--line2); }
        .landing .stats > div { background:#fff; padding:14px 16px; }
        .landing .stats .k { font-size:11px; color:var(--mute); }
        .landing .stats .v { font-size:20px; font-weight:800; margin-top:3px; }
        .landing .rows { padding:6px 18px 16px; }
        .landing .row { display:grid; grid-template-columns:1.4fr 1fr 1fr; align-items:center; padding:13px 0; font-size:12.5px; border-bottom:1px solid var(--line2); }
        .landing .row.head { padding:12px 0; font-size:11px; font-weight:600; color:var(--mute); border-bottom:1px solid var(--line); }
        .landing .row:last-child { border-bottom:none; }
        .landing .sec { padding:0 0 76px; scroll-margin-top:84px; }
        .landing .rule { border-top:1px solid var(--line); padding-top:40px; }
        .landing h2.big { font-size:44px; font-weight:800; letter-spacing:-.03em; margin-bottom:30px; }
        .landing .process { display:flex; align-items:stretch; }
        .landing .process > div { flex:1; padding:22px 24px; border-right:1px solid var(--line); }
        .landing .process > div:first-child { padding-left:0; }
        .landing .process > div:last-child { border-right:none; padding-right:0; }
        .landing .process span { font-size:11px; font-weight:700; color:var(--mute); }
        .landing .process h3 { margin:9px 0 7px; font-size:15px; font-weight:700; }
        .landing .process p { font-size:12.5px; line-height:1.7; color:var(--graphite); }
        .landing .duo { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .landing .duo > div { border:1px solid var(--line); border-radius:22px; padding:28px; background:var(--card); }
        .landing .duo h3 { margin:10px 0; font-size:20px; font-weight:800; letter-spacing:-.02em; }
        .landing .duo p { margin-bottom:18px; font-size:13.5px; line-height:1.8; color:var(--graphite); }
        .landing .shot { height:150px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:repeating-linear-gradient(135deg,#F2F1EE 0 9px,#EAE9E5 9px 18px); }
        .landing .shot span { font:500 11px ui-monospace,Menlo,monospace; color:var(--mute); background:#fff; padding:6px 12px; border-radius:6px; }
        .landing .faq { display:grid; grid-template-columns:.8fr 1.2fr; gap:40px; }
        .landing .faq h2 { font-size:26px; font-weight:800; letter-spacing:-.025em; }
        .landing .faq .list { border-top:1px solid var(--line); }
        .landing .faq .item { padding:18px 0; border-bottom:1px solid var(--line2); }
        .landing .faq h3 { margin-bottom:7px; font-size:14.5px; font-weight:700; }
        .landing .faq p { font-size:13px; line-height:1.8; color:var(--graphite); }
        .landing .closing { border:1px solid var(--line); border-radius:22px; padding:44px; display:flex; align-items:center; justify-content:space-between; gap:32px; }
        .landing .closing h2 { font-size:26px; font-weight:800; letter-spacing:-.025em; }
        .landing .closing p { margin-top:10px; font-size:14px; color:var(--graphite); }
        .landing footer { border-top:1px solid var(--line); padding:26px 40px; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--mute); }
        .landing footer .links { display:flex; gap:20px; }
        @media (max-width:900px) {
          .landing .lp-wrap { padding:0 20px; }
          .landing .lp-bar { padding:0 20px; }
          .landing .lp-nav { display:none; }
          .landing .hero { grid-template-columns:1fr; gap:32px; padding:48px 0 40px; }
          .landing .hero h1 { font-size:34px; }
          .landing .process { flex-direction:column; }
          .landing .process > div { border-right:none; border-bottom:1px solid var(--line); padding:20px 0; }
          .landing .process > div:last-child { border-bottom:none; }
          .landing h2.big { font-size:32px; }
          .landing .duo, .landing .faq { grid-template-columns:1fr; }
          .landing .closing { flex-direction:column; align-items:flex-start; }
          .landing .stats { grid-template-columns:repeat(2,1fr); }
        }
    </style>
</head>
<body class="rc">
    <!-- ⚠️ 외부 CDN 스크립트 일절 없음: 오직 내부 root 인젝션 주입만 사용 -->
    <div id="root"></div>
</body>
</html>
